<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile FaceID Check-In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

        .mobile-container { width: 100%; max-width: 400px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; }

        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header p { font-size: 13px; color: #bdc3c7; }

        .body-content { padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        .camera-box { width: 100%; height: 260px; background: #1a252f; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; border: 2px dashed #34495e; }
        .camera-box video, .camera-box canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; }
        .camera-placeholder { color: #95a5a6; font-size: 14px; text-align: center; padding: 0 20px; z-index: 2; }
        .camera-placeholder span { font-size: 40px; display: block; margin-bottom: 8px; }

        .scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 3px solid rgba(46, 204, 113, 0.6); border-radius: 12px; display: none; z-index: 3; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { border-color: rgba(46, 204, 113, 0.3); }
            50% { border-color: rgba(46, 204, 113, 1); }
            100% { border-color: rgba(46, 204, 113, 0.3); }
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; font-weight: 600; color: #7f8c8d; text-transform: uppercase; }
        input { padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 14px; outline: none; background: #fafafa; }
        input:focus { border-color: #3498db; background: #fff; }

        .action-btn { width: 100%; padding: 14px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2); }
        .action-btn:hover { background-color: #219653; }
        .action-btn.secondary { background-color: #3498db; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2); margin-bottom: 5px; }
        .action-btn.secondary:hover { background-color: #2980b9; }

        .status-card { background: #e8f8f5; border-left: 5px solid #27ae60; padding: 15px; border-radius: 8px; display: none; }
        .status-card h3 { font-size: 15px; color: #27ae60; margin-bottom: 4px; }
        .status-card p { font-size: 13px; color: #555; }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <div class="header">
            <h1>Mobile FaceID Check-In</h1>
            <p>Scan face to log attendance</p>
        </div>

        <div class="body-content">
            
            <div class="camera-box" id="cameraBox">
                <div class="scan-overlay" id="scanOverlay"></div>
                <div class="camera-placeholder" id="cameraPlaceholder">
                    <span>📷</span>
                    Camera feed is inactive. Tap start to begin check-in.
                </div>
                <video id="videoElement" autoplay playsinline></video>
            </div>

            <button class="action-btn secondary" id="startCamBtn" onclick="startCamera()">Turn On Camera</button>

            <div class="form-group">
                <label>Student ID</label>
                <input type="text" id="mobileStudentId" placeholder="Enter your Student ID (e.g., S101)">
            </div>

            <button class="action-btn" onclick="verifyAttendance()">Verify & Check In</button>

            <div class="status-card" id="statusCard">
                <h3>Success!</h3>
                <p id="statusMessage">Attendance logged successfully for student.</p>
            </div>

        </div>

    </div>

    <script>
        let videoStream = null;

        async function startCamera() {
            const video = document.getElementById('videoElement');
            const placeholder = document.getElementById('cameraPlaceholder');
            const overlay = document.getElementById('scanOverlay');
            const startBtn = document.getElementById('startCamBtn');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                video.srcObject = videoStream;
                video.style.display = 'block';
                placeholder.style.display = 'none';
                overlay.style.display = 'block';
                startBtn.innerText = 'Camera Active';
                startBtn.style.backgroundColor = '#7f8c8d';
                startBtn.disabled = true;
            } catch (err) {
                alert("Unable to access camera. Please check permissions.");
                console.error(err);
            }
        }

        function verifyAttendance() {
            let id = document.getElementById('mobileStudentId').value.trim();
            if (!id) {
                alert("Please enter your Student ID first.");
                return;
            }

            let savedStudents = JSON.parse(localStorage.getItem('face_students')) || [];
            let foundStudent = savedStudents.find(s => s.id === id);

            let studentName = foundStudent ? foundStudent.name : "Verified Student (" + id + ")";

            let attendance = JSON.parse(localStorage.getItem('face_attendance')) || [];
            
            attendance.unshift({
                id: id,
                name: studentName,
                time: new Date().toLocaleTimeString(),
                status: 'Verified Present'
            });

            localStorage.setItem('face_attendance', JSON.stringify(attendance));

            let statusCard = document.getElementById('statusCard');
            let statusMessage = document.getElementById('statusMessage');
            statusMessage.innerText = `Attendance successfully recorded for ${studentName} at ${new Date().toLocaleTimeString()}`;
            statusCard.style.display = 'block';

            document.getElementById('mobileStudentId').value = '';
        }
    </script>
</body>
</html>
